<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akshay's Store — MacBook Wake Animation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       LAYER 0 — macOS Desktop (revealed behind)
  ═══════════════════════════════════════════ -->
  <div id="desktop">

    <!-- Menu Bar -->
    <div id="menu-bar">
      <span class="menu-apple">&#63743;</span>
      <span class="menu-item active">Finder</span>
      <span class="menu-item">File</span>
      <span class="menu-item">Edit</span>
      <span class="menu-item">View</span>
      <span class="menu-item">Go</span>
      <span class="menu-item">Window</span>
      <span class="menu-right">
        <span>&#8984; 100%</span>
        <span>Wi-Fi</span>
        <span id="clock">10:41</span>
      </span>
    </div>

    <!-- Wallpaper (pure CSS gradient) -->
    <div id="wallpaper"></div>

    <!-- Light rays overlay -->
    <div id="light-rays">
      <div class="ray ray-1"></div>
      <div class="ray ray-2"></div>
      <div class="ray ray-3"></div>
    </div>

    <!-- Dock -->
    <div id="dock-wrapper">
      <div id="dock">
        <div class="dock-icon" data-label="Finder">
          <div class="icon icon-finder"></div>
        </div>
        <div class="dock-icon" data-label="Safari">
          <div class="icon icon-safari"></div>
        </div>
        <div class="dock-icon" data-label="Messages">
          <div class="icon icon-messages"></div>
        </div>
        <div class="dock-icon" data-label="Music">
          <div class="icon icon-music"></div>
        </div>
        <div class="dock-separator"></div>
        <div class="dock-icon" data-label="Store">
          <div class="icon icon-store"></div>
        </div>
        <div class="dock-icon" data-label="Photos">
          <div class="icon icon-photos"></div>
        </div>
        <div class="dock-separator"></div>
        <div class="dock-icon" data-label="Trash">
          <div class="icon icon-trash"></div>
        </div>
      </div>
    </div>

  </div><!-- /#desktop -->


  <!-- ═══════════════════════════════════════════
       LAYER 1 — Shop Shutter (covers everything)
  ═══════════════════════════════════════════ -->
  <div id="shutter-container">

    <!-- Ambient dark overlay (fades as shutter opens) -->
    <div id="darkness-overlay"></div>

    <!-- Spotlight on closed shutter -->
    <div id="spotlight"></div>

    <!-- The actual shutter — strips generated by JS -->
    <div id="shutter">
      <div id="shutter-strips-wrap">
        <!-- .shutter-strip × N  injected by script.js -->
      </div>

      <!-- ── Branding Panel centred on shutter ── -->
      <div id="shutter-brand">
        <div id="brand-inner">
          <div id="brand-icon">⚙</div>
          <div id="brand-name">AKSHAY'S STORE</div>
          <div id="brand-tagline">EST. 2024 · PREMIUM GOODS</div>
          <div id="brand-divider"></div>
          <div id="brand-sub">CLOSED FOR THE NIGHT</div>
        </div>
      </div>
    </div><!-- /#shutter -->

    <!-- Shadow cast by bottom edge of shutter as it rises -->
    <div id="shutter-edge-shadow"></div>

  </div><!-- /#shutter-container -->


  <!-- ═══════════════════════════════════════════
       LAYER 2 — UI hints
  ═══════════════════════════════════════════ -->
  <div id="hint-bar">
    <span><kbd>Space</kbd> Replay</span>
    <span><kbd>R</kbd> Reset</span>
    <span><kbd>F</kbd> Fullscreen</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
